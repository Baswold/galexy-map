<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Forge - 3D Star Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        #info strong {
            font-size: 16px;
            color: #4da6ff;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #searchPanel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            min-width: 300px;
        }
        #searchInput {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #searchInput:focus {
            border-color: #4da6ff;
            background: rgba(255, 255, 255, 0.15);
        }
        #searchResults {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .searchResult {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .searchResult:hover {
            background: rgba(77, 166, 255, 0.2);
            border-color: #4da6ff;
        }
        .searchResult-name {
            color: #4da6ff;
            font-weight: bold;
        }
        .searchResult-details {
            color: #aaa;
            font-size: 12px;
            margin-top: 3px;
        }
        #detailPanel {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            min-width: 350px;
            max-width: 400px;
            display: none;
            color: #fff;
        }
        #detailPanel h2 {
            color: #4da6ff;
            margin-bottom: 15px;
            font-size: 20px;
        }
        #detailPanel .detail-row {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        #detailPanel .detail-label {
            color: #999;
            font-size: 13px;
        }
        #detailPanel .detail-value {
            color: #fff;
            font-weight: bold;
            font-size: 13px;
        }
        .closeButton {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }
        .closeButton:hover {
            background: rgba(255, 100, 100, 0.3);
            border-color: #ff6464;
        }
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
        }
        #controlPanel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
        }
        .control-group {
            margin: 10px 0;
        }
        .control-group label {
            display: block;
            color: #999;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .control-group input[type="range"] {
            width: 200px;
        }
        .control-group button {
            padding: 8px 15px;
            background: rgba(77, 166, 255, 0.2);
            border: 1px solid #4da6ff;
            color: #4da6ff;
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
            transition: all 0.2s;
        }
        .control-group button:hover {
            background: rgba(77, 166, 255, 0.4);
        }
        .control-group button.active {
            background: #4da6ff;
            color: #000;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(77, 166, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(77, 166, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="loading">Loading astronomical data...</div>

    <div id="info">
        <strong>Galaxy Forge</strong><br>
        <span id="starCount">0</span> stars | <span id="planetCount">0</span> planets<br>
        <span id="systemCount">0</span> planetary systems<br><br>
        <strong>Controls:</strong><br>
        • Click objects for details<br>
        • Drag to rotate<br>
        • Scroll to zoom<br>
        • Right-drag to pan<br><br>
        <span id="cameraPos"></span>
    </div>

    <div id="searchPanel">
        <input type="text" id="searchInput" placeholder="Search stars & planets...">
        <div id="searchResults"></div>
    </div>

    <div id="detailPanel">
        <div class="closeButton" id="closeDetail">×</div>
        <div id="detailContent"></div>
    </div>

    <div id="tooltip"></div>

    <div id="controlPanel">
        <div class="control-group">
            <label>Quick Navigation</label>
            <button onclick="goToSolarSystem()">Solar System</button>
            <button onclick="goToProximaCentauri()">Proxima Centauri</button>
            <button onclick="goToSirius()">Sirius</button>
        </div>
        <div class="control-group">
            <label>View Options</label>
            <button id="toggleOrbits" class="active" onclick="toggleOrbits()">Orbits</button>
            <button id="toggleLabels" onclick="toggleLabels()">Labels</button>
            <button id="toggleConstellations" onclick="toggleConstellations()">Constellations</button>
        </div>
        <div class="control-group">
            <label>Time Simulation</label>
            <button id="playPause" class="active" onclick="toggleTimeSimulation()">⏸ Pause</button>
            <button onclick="changeTimeSpeed(-1)">◀ Slower</button>
            <button onclick="changeTimeSpeed(1)">Faster ▶</button>
            <div style="color: #999; font-size: 11px; margin-top: 5px;">
                Speed: <span id="timeSpeedDisplay">1x</span>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Post-processing for bloom effect
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.5,  // strength
            0.4,  // radius
            0.85  // threshold
        );
        composer.addPass(bloomPass);

        // Camera controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 50000;
        controls.minDistance = 1;

        // Set initial camera position
        camera.position.set(0, 100, 200);
        controls.update();

        // Global state
        let starsData = [];
        let planetsData = [];
        let starObjects = [];
        let planetObjects = [];
        let orbitLines = [];
        let selectedObject = null;
        let hoveredObject = null;
        let showOrbits = true;
        let showLabels = false;

        // Time simulation state
        let timeSimulationActive = true;
        let simulatedTime = 0;  // In Earth days
        let timeSpeed = 1;  // Multiplier (1 = 1 day per second)
        const timeSpeedLevels = [0.1, 0.5, 1, 2, 5, 10, 50, 100, 500, 1000];
        let timeSpeedIndex = 2;  // Start at 1x

        // Raycaster for object picking
        const raycaster = new THREE.Raycaster();
        raycaster.params.Points.threshold = 2;
        const mouse = new THREE.Vector2();

        // Groups for organization
        const planetGroup = new THREE.Group();
        const orbitGroup = new THREE.Group();
        const labelGroup = new THREE.Group();
        scene.add(planetGroup);
        scene.add(orbitGroup);
        scene.add(labelGroup);

        // Add ambient light for better visibility
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        // Create beautiful space background with distant stars
        function createSpaceBackground() {
            // Create sphere geometry for skybox
            const geometry = new THREE.SphereGeometry(50000, 64, 64);

            // Vertex shader for animated nebula-like background
            const vertexShader = `
                varying vec3 vPosition;
                varying vec2 vUv;
                void main() {
                    vPosition = position;
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;

            // Fragment shader for space background
            const fragmentShader = `
                varying vec3 vPosition;
                varying vec2 vUv;
                uniform float time;

                // Simple noise function
                float random(vec2 st) {
                    return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
                }

                void main() {
                    vec3 color = vec3(0.0);

                    // Dark blue to black gradient
                    float gradient = smoothstep(-1.0, 1.0, vPosition.y / 50000.0);
                    color = mix(vec3(0.0, 0.0, 0.05), vec3(0.05, 0.0, 0.1), gradient);

                    // Add distant stars
                    float stars = random(vUv * 500.0);
                    if (stars > 0.998) {
                        color += vec3(1.0) * (stars - 0.998) * 500.0;
                    }

                    // Add some color variation for nebula-like effect
                    float nebula = random(vUv * 10.0 + time * 0.0001);
                    color += vec3(0.1, 0.0, 0.2) * nebula * 0.1;

                    gl_FragColor = vec4(color, 1.0);
                }
            `;

            const material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    time: { value: 0.0 }
                },
                side: THREE.BackSide
            });

            const skybox = new THREE.Mesh(geometry, material);
            scene.add(skybox);

            return skybox;
        }

        const spaceBackground = createSpaceBackground();

        // Create asteroid belt for Solar System
        function createAsteroidBelt() {
            const asteroidGeometry = new THREE.BufferGeometry();
            const asteroidPositions = [];
            const asteroidColors = [];
            const asteroidSizes = [];

            // Asteroid belt is between Mars (1.524 AU) and Jupiter (5.203 AU)
            // Main belt is roughly 2.2 to 3.2 AU from the Sun
            const innerRadius = 2.2 * 4.84814e-6 * 10; // AU to parsecs, scaled
            const outerRadius = 3.2 * 4.84814e-6 * 10;
            const asteroidCount = 2000;

            // Sol is at origin (approximately)
            const solX = 0;
            const solY = 0;
            const solZ = 0;

            for (let i = 0; i < asteroidCount; i++) {
                // Random radius between inner and outer
                const radius = innerRadius + Math.random() * (outerRadius - innerRadius);

                // Random angle
                const angle = Math.random() * Math.PI * 2;

                // Small random inclination
                const inclination = (Math.random() - 0.5) * 0.15;

                // Position in belt
                const x = solX + radius * Math.cos(angle) * Math.cos(inclination);
                const y = solY + radius * Math.sin(angle) * Math.cos(inclination);
                const z = solZ + radius * Math.sin(inclination);

                asteroidPositions.push(x, y, z);

                // Gray/brown colors for asteroids
                const grayValue = 0.3 + Math.random() * 0.2;
                asteroidColors.push(grayValue, grayValue * 0.9, grayValue * 0.8);

                // Small sizes
                asteroidSizes.push(0.3 + Math.random() * 0.5);
            }

            asteroidGeometry.setAttribute('position', new THREE.Float32BufferAttribute(asteroidPositions, 3));
            asteroidGeometry.setAttribute('color', new THREE.Float32BufferAttribute(asteroidColors, 3));
            asteroidGeometry.setAttribute('size', new THREE.Float32BufferAttribute(asteroidSizes, 1));

            const asteroidMaterial = new THREE.PointsMaterial({
                size: 0.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                sizeAttenuation: true
            });

            const asteroidBelt = new THREE.Points(asteroidGeometry, asteroidMaterial);
            scene.add(asteroidBelt);

            return asteroidBelt;
        }

        const asteroidBelt = createAsteroidBelt();

        // Create constellation lines
        function createConstellations() {
            const constellationGroup = new THREE.Group();

            // Define major constellations by star names
            const constellations = [
                {
                    name: 'Orion',
                    stars: [
                        ['Betelgeuse', 'Bellatrix'],
                        ['Bellatrix', 'Rigel'],
                        ['Rigel', 'Betelgeuse'],
                        ['Alnilam', 'Alnitak'],  // Belt
                        ['Alnitak', 'Mintaka'],
                        ['Betelgeuse', 'Alnilam'],
                        ['Rigel', 'Alnilam']
                    ],
                    color: 0x4477aa
                },
                {
                    name: 'Ursa Major (Big Dipper)',
                    stars: [
                        ['Dubhe', 'Alkaid'],
                        ['Alkaid', 'Alioth'],
                        ['Alioth', 'Dubhe']
                    ],
                    color: 0x44aa77
                },
                {
                    name: 'Cassiopeia',
                    stars: [
                        ['Schedar', 'Caph']
                    ],
                    color: 0xaa4477
                },
                {
                    name: 'Canis Major',
                    stars: [
                        ['Sirius', 'Adhara'],
                        ['Adhara', 'Wezen'],
                        ['Wezen', 'Sirius'],
                        ['Mirzam', 'Sirius']
                    ],
                    color: 0x77aa44
                }
            ];

            // Create a map of star names to positions
            const starPositions = {};
            starsData.forEach(star => {
                if (star.name) {
                    starPositions[star.name] = new THREE.Vector3(
                        star.x * 10,
                        star.y * 10,
                        star.z * 10
                    );
                }
            });

            // Draw constellation lines
            constellations.forEach(constellation => {
                constellation.stars.forEach(([star1, star2]) => {
                    const pos1 = starPositions[star1];
                    const pos2 = starPositions[star2];

                    if (pos1 && pos2) {
                        const points = [pos1, pos2];
                        const geometry = new THREE.BufferGeometry().setFromPoints(points);
                        const material = new THREE.LineBasicMaterial({
                            color: constellation.color,
                            transparent: true,
                            opacity: 0.3,
                            linewidth: 1
                        });
                        const line = new THREE.Line(geometry, material);
                        constellationGroup.add(line);
                    }
                });
            });

            constellationGroup.visible = false;  // Hidden by default
            scene.add(constellationGroup);
            return constellationGroup;
        }

        let constellationLines = null;

        // Mouse event handlers
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Update raycaster
            raycaster.setFromCamera(mouse, camera);

            // Check for intersections with planets
            const planetIntersects = raycaster.intersectObjects(planetObjects);

            // Check for intersections with stars (points)
            const starIntersects = raycaster.intersectObject(starObjects[0]);

            const tooltip = document.getElementById('tooltip');

            if (planetIntersects.length > 0) {
                const planet = planetIntersects[0].object;
                hoveredObject = planet;
                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 10 + 'px';
                tooltip.style.top = event.clientY + 10 + 'px';
                tooltip.textContent = planet.userData.name;
                document.body.style.cursor = 'pointer';
            } else if (starIntersects.length > 0 && starIntersects[0].index !== undefined) {
                const starIndex = starIntersects[0].index;
                const star = starsData[starIndex];
                hoveredObject = { type: 'star', data: star, index: starIndex };
                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 10 + 'px';
                tooltip.style.top = event.clientY + 10 + 'px';
                tooltip.textContent = star.name || `Star ${starIndex}`;
                document.body.style.cursor = 'pointer';
            } else {
                hoveredObject = null;
                tooltip.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }

        function onClick(event) {
            if (!hoveredObject) return;

            if (hoveredObject.type === 'star') {
                showStarDetails(hoveredObject.data);
            } else {
                showPlanetDetails(hoveredObject.userData);
            }
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('click', onClick);

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const resultsDiv = document.getElementById('searchResults');

            if (query.length < 2) {
                resultsDiv.innerHTML = '';
                return;
            }

            const starResults = starsData.filter(star =>
                (star.name && star.name.toLowerCase().includes(query))
            ).slice(0, 5);

            const planetResults = planetsData.filter(planet =>
                planet.name.toLowerCase().includes(query) ||
                planet.star.toLowerCase().includes(query)
            ).slice(0, 5);

            let html = '';

            if (starResults.length > 0) {
                html += '<div style="color: #999; font-size: 11px; margin: 5px 0;">STARS</div>';
                starResults.forEach(star => {
                    html += `
                        <div class="searchResult" onclick="focusOnStar('${star.name}')">
                            <div class="searchResult-name">${star.name}</div>
                            <div class="searchResult-details">${star.spect} • ${star.dist.toFixed(2)} pc • mag ${star.mag.toFixed(2)}</div>
                        </div>
                    `;
                });
            }

            if (planetResults.length > 0) {
                html += '<div style="color: #999; font-size: 11px; margin: 10px 0 5px 0;">PLANETS</div>';
                planetResults.forEach(planet => {
                    html += `
                        <div class="searchResult" onclick="focusOnPlanet('${planet.name}')">
                            <div class="searchResult-name">${planet.name}</div>
                            <div class="searchResult-details">${planet.star} • ${planet.type.replace('_', ' ')}</div>
                        </div>
                    `;
                });
            }

            if (html === '') {
                html = '<div style="color: #666; padding: 10px; text-align: center;">No results found</div>';
            }

            resultsDiv.innerHTML = html;
        });

        // Detail panel functions
        function showStarDetails(star) {
            const panel = document.getElementById('detailPanel');
            const content = document.getElementById('detailContent');

            let html = `
                <h2>${star.name || 'Unnamed Star'}</h2>
                <div class="detail-row">
                    <span class="detail-label">Spectral Type</span>
                    <span class="detail-value">${star.spect || 'Unknown'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Distance</span>
                    <span class="detail-value">${star.dist.toFixed(2)} pc (${(star.dist * 3.26).toFixed(1)} ly)</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Apparent Magnitude</span>
                    <span class="detail-value">${star.mag.toFixed(2)}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Position</span>
                    <span class="detail-value">RA ${star.ra.toFixed(3)}h, Dec ${star.dec.toFixed(3)}°</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Coordinates</span>
                    <span class="detail-value">(${star.x.toFixed(2)}, ${star.y.toFixed(2)}, ${star.z.toFixed(2)}) pc</span>
                </div>
            `;

            // Check if star has planets
            const planets = planetsData.filter(p => p.star === star.name);
            if (planets.length > 0) {
                html += `
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                        <div style="color: #4da6ff; font-weight: bold; margin-bottom: 10px;">Known Planets (${planets.length})</div>
                `;
                planets.forEach(planet => {
                    html += `
                        <div style="margin: 5px 0; padding: 5px; background: rgba(255,255,255,0.05); border-radius: 3px; cursor: pointer;" onclick="focusOnPlanet('${planet.name}')">
                            <div style="color: #4da6ff; font-size: 12px;">${planet.name}</div>
                            <div style="color: #888; font-size: 11px;">${planet.type.replace('_', ' ')} • ${planet.orbit_au.toFixed(3)} AU</div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            content.innerHTML = html;
            panel.style.display = 'block';
        }

        function showPlanetDetails(body) {
            const panel = document.getElementById('detailPanel');
            const content = document.getElementById('detailContent');

            const typeNames = {
                'terrestrial': 'Terrestrial (Rocky)',
                'super_earth': 'Super-Earth',
                'gas_giant': 'Gas Giant',
                'ice_giant': 'Ice Giant',
                'moon': 'Natural Satellite (Moon)'
            };

            // Check if this is a moon or planet
            const isMoon = body.type === 'moon' || (body.planet && body.planet !== '');

            let html = `<h2>${body.name}</h2>`;

            if (isMoon) {
                // Moon details
                html += `
                    <div class="detail-row">
                        <span class="detail-label">Type</span>
                        <span class="detail-value">Moon</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Parent Planet</span>
                        <span class="detail-value" style="color: #ffaa44; cursor: pointer;" onclick="focusOnPlanet('${body.planet}')">${body.planet}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Parent Star</span>
                        <span class="detail-value" style="color: #4da6ff; cursor: pointer;" onclick="focusOnStar('${body.star}')">${body.star}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Orbital Distance (from planet)</span>
                        <span class="detail-value">${body.orbit_au.toFixed(6)} AU (${(body.orbit_au * 149597870.7).toFixed(0)} km)</span>
                    </div>
                `;
            } else {
                // Planet details
                html += `
                    <div class="detail-row">
                        <span class="detail-label">Type</span>
                        <span class="detail-value">${typeNames[body.type] || body.type}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Parent Star</span>
                        <span class="detail-value" style="color: #4da6ff; cursor: pointer;" onclick="focusOnStar('${body.star}')">${body.star}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Orbital Distance</span>
                        <span class="detail-value">${body.orbit_au.toFixed(4)} AU</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Orbital Period</span>
                        <span class="detail-value">${body.period_days.toFixed(1)} days (${(body.period_days / 365.25).toFixed(2)} years)</span>
                    </div>
                `;
            }

            html += `
                <div class="detail-row">
                    <span class="detail-label">Radius</span>
                    <span class="detail-value">${body.radius_earth.toFixed(3)} Earth radii</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Mass</span>
                    <span class="detail-value">${body.mass_earth.toFixed(3)} Earth masses</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Coordinates</span>
                    <span class="detail-value">(${body.x.toFixed(6)}, ${body.y.toFixed(6)}, ${body.z.toFixed(6)}) pc</span>
                </div>
            `;

            // Show moons if this is a planet with moons
            if (!isMoon) {
                const moons = planetsData.filter(p => p.planet === body.name && p.type === 'moon');
                if (moons.length > 0) {
                    html += `
                        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                            <div style="color: #4da6ff; font-weight: bold; margin-bottom: 10px;">Known Moons (${moons.length})</div>
                    `;
                    moons.forEach(moon => {
                        html += `
                            <div style="margin: 5px 0; padding: 5px; background: rgba(255,255,255,0.05); border-radius: 3px; cursor: pointer;" onclick="focusOnPlanet('${moon.name}')">
                                <div style="color: #aaa; font-size: 12px;">${moon.name}</div>
                                <div style="color: #888; font-size: 11px;">${moon.radius_earth.toFixed(3)} R⊕ • ${(moon.orbit_au * 149597870.7).toFixed(0)} km</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
            }

            content.innerHTML = html;
            panel.style.display = 'block';
        }

        document.getElementById('closeDetail').addEventListener('click', () => {
            document.getElementById('detailPanel').style.display = 'none';
        });

        // Navigation functions
        window.focusOnStar = function(starName) {
            const star = starsData.find(s => s.name === starName);
            if (!star) return;

            const targetPos = new THREE.Vector3(star.x * 10, star.y * 10, star.z * 10);
            const distance = 50;

            camera.position.set(
                targetPos.x + distance,
                targetPos.y + distance,
                targetPos.z + distance
            );
            controls.target.copy(targetPos);
            controls.update();

            showStarDetails(star);
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchInput').value = '';
        };

        window.focusOnPlanet = function(planetName) {
            const planet = planetsData.find(p => p.name === planetName);
            if (!planet) return;

            const targetPos = new THREE.Vector3(planet.x * 10, planet.y * 10, planet.z * 10);
            const distance = 20;

            camera.position.set(
                targetPos.x + distance,
                targetPos.y + distance,
                targetPos.z + distance
            );
            controls.target.copy(targetPos);
            controls.update();

            showPlanetDetails(planet);
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchInput').value = '';
        };

        window.goToSolarSystem = function() {
            focusOnStar('Sol');
        };

        window.goToProximaCentauri = function() {
            focusOnStar('Proxima Centauri');
        };

        window.goToSirius = function() {
            focusOnStar('Sirius');
        };

        window.toggleOrbits = function() {
            showOrbits = !showOrbits;
            orbitGroup.visible = showOrbits;
            document.getElementById('toggleOrbits').classList.toggle('active');
        };

        window.toggleLabels = function() {
            showLabels = !showLabels;
            labelGroup.visible = showLabels;
            document.getElementById('toggleLabels').classList.toggle('active');
        };

        window.toggleConstellations = function() {
            if (constellationLines) {
                constellationLines.visible = !constellationLines.visible;
                document.getElementById('toggleConstellations').classList.toggle('active');
            }
        };

        window.toggleTimeSimulation = function() {
            timeSimulationActive = !timeSimulationActive;
            const button = document.getElementById('playPause');
            button.textContent = timeSimulationActive ? '⏸ Pause' : '▶ Play';
            button.classList.toggle('active');
        };

        window.changeTimeSpeed = function(direction) {
            timeSpeedIndex = Math.max(0, Math.min(timeSpeedLevels.length - 1, timeSpeedIndex + direction));
            timeSpeed = timeSpeedLevels[timeSpeedIndex];
            document.getElementById('timeSpeedDisplay').textContent = `${timeSpeed}x`;
        };

        // Update planetary positions based on orbital mechanics
        function updateOrbitalPositions(deltaTime) {
            if (!timeSimulationActive) return;

            // Update simulated time (deltaTime is in seconds, convert to days)
            simulatedTime += deltaTime * timeSpeed * 60;  // 60x speed up for visibility

            // Update each planet
            planetObjects.forEach((planetMesh, index) => {
                const planetData = planetMesh.userData;

                // Skip moons for now (they need special handling)
                if (planetData.type === 'moon' || planetData.planet) return;

                // Find the star position
                const star = starsData.find(s => s.name === planetData.star);
                if (!star) return;

                const starPos = { x: star.x * 10, y: star.y * 10, z: star.z * 10 };

                // Calculate orbital position
                const period = planetData.period_days;
                if (!period || period === 0) return;

                const orbitRadius = planetData.orbit_au * 4.84814e-6 * 10;  // AU to parsecs, scaled

                // Calculate angle based on time and period
                const angle = (simulatedTime / period) * 2 * Math.PI;

                // Calculate position (simplified circular orbit in XY plane)
                const x = starPos.x + orbitRadius * Math.cos(angle);
                const y = starPos.y + orbitRadius * Math.sin(angle);
                const z = starPos.z;

                // Update planet position
                planetMesh.position.set(x, y, z);
            });
        }

        // Function to convert spectral class to color
        function getStarColor(spectralClass) {
            if (!spectralClass) return 0xffffff;
            const type = spectralClass.charAt(0).toUpperCase();

            // Based on actual stellar spectral classifications
            const colorMap = {
                'O': 0x9bb0ff, // Blue
                'B': 0xaabfff, // Blue-white
                'A': 0xcad7ff, // White
                'F': 0xf8f7ff, // Yellow-white
                'G': 0xfff4ea, // Yellow (like our Sun)
                'K': 0xffd2a1, // Orange
                'M': 0xffcc6f, // Red-orange
            };

            return colorMap[type] || 0xffffff;
        }

        // Load star data
        async function loadStarData() {
            try {
                const response = await fetch('data/hygdata_v3.csv');
                const csvText = await response.text();

                const lines = csvText.split('\n');
                const headers = lines[0].split(',');

                // Find column indices
                const idIndex = headers.indexOf('id');
                const xIndex = headers.indexOf('x');
                const yIndex = headers.indexOf('y');
                const zIndex = headers.indexOf('z');
                const magIndex = headers.indexOf('mag');
                const specIndex = headers.indexOf('spect');
                const properNameIndex = headers.indexOf('proper');
                const distIndex = headers.indexOf('dist');
                const raIndex = headers.indexOf('ra');
                const decIndex = headers.indexOf('dec');

                const stars = [];

                // Parse CSV (skip header)
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;

                    const cols = lines[i].split(',');

                    const id = parseInt(cols[idIndex]);
                    const x = parseFloat(cols[xIndex]);
                    const y = parseFloat(cols[yIndex]);
                    const z = parseFloat(cols[zIndex]);
                    const mag = parseFloat(cols[magIndex]);
                    const spect = cols[specIndex];
                    const name = cols[properNameIndex];
                    const dist = parseFloat(cols[distIndex]);
                    const ra = parseFloat(cols[raIndex]);
                    const dec = parseFloat(cols[decIndex]);

                    if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
                        stars.push({ id, x, y, z, mag, spect, name, dist, ra, dec });
                    }
                }

                return stars;
            } catch (error) {
                console.error('Error loading star data:', error);
                return [];
            }
        }

        // Load planet data
        async function loadPlanetData() {
            try {
                const response = await fetch('data/planets.csv');
                const csvText = await response.text();

                const lines = csvText.split('\n');
                const headers = lines[0].split(',');

                // Find column indices
                const nameIndex = headers.indexOf('name');
                const starIndex = headers.indexOf('star');
                const planetIndex = headers.indexOf('planet');
                const xIndex = headers.indexOf('x');
                const yIndex = headers.indexOf('y');
                const zIndex = headers.indexOf('z');
                const orbitIndex = headers.indexOf('orbit_au');
                const radiusIndex = headers.indexOf('radius_earth');
                const massIndex = headers.indexOf('mass_earth');
                const periodIndex = headers.indexOf('period_days');
                const typeIndex = headers.indexOf('type');

                const planets = [];

                // Parse CSV (skip header)
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;

                    const cols = lines[i].split(',');

                    const x = parseFloat(cols[xIndex]);
                    const y = parseFloat(cols[yIndex]);
                    const z = parseFloat(cols[zIndex]);
                    const name = cols[nameIndex];
                    const star = cols[starIndex];
                    const planet = cols[planetIndex] || '';
                    const orbit_au = parseFloat(cols[orbitIndex]);
                    const radius_earth = parseFloat(cols[radiusIndex]);
                    const mass_earth = parseFloat(cols[massIndex]);
                    const period_days = parseFloat(cols[periodIndex]);
                    const type = cols[typeIndex];

                    if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
                        planets.push({ x, y, z, name, star, planet, orbit_au, radius_earth, mass_earth, period_days, type });
                    }
                }

                return planets;
            } catch (error) {
                console.error('Error loading planet data:', error);
                return [];
            }
        }

        // Get planet color based on type
        function getPlanetColor(type) {
            const colorMap = {
                'terrestrial': 0x8b7355,      // Brown/rocky
                'super_earth': 0x5588aa,      // Blue-gray
                'gas_giant': 0xdaa520,        // Golden/orange
                'ice_giant': 0x4682b4,        // Steel blue
                'moon': 0xaaaaaa,             // Light gray for moons
            };
            return colorMap[type] || 0x888888;
        }

        // Create star visualization
        function createStarField(stars) {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];

            stars.forEach(star => {
                // Position (scale coordinates for better visibility)
                positions.push(star.x * 10, star.y * 10, star.z * 10);

                // Color based on spectral class
                const color = new THREE.Color(getStarColor(star.spect));
                colors.push(color.r, color.g, color.b);

                // Size based on apparent magnitude (brighter = bigger)
                // Magnitude scale is inverted (lower = brighter)
                const brightness = Math.max(0.5, 8 - star.mag);
                sizes.push(brightness);
            });

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Custom shader material for better star rendering
            const material = new THREE.PointsMaterial({
                size: 2,
                vertexColors: true,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);
            starObjects.push(points);

            return points;
        }

        // Create planet visualization
        function createPlanets(planets, stars) {
            // Create a map of star names to positions for orbit drawing
            const starMap = {};
            stars.forEach(star => {
                starMap[star.name] = { x: star.x * 10, y: star.y * 10, z: star.z * 10 };
            });

            planets.forEach(planet => {
                // Create planet sphere
                const radius = Math.max(0.5, Math.log(planet.radius_earth + 1) * 0.3);
                const geometry = new THREE.SphereGeometry(radius, 16, 16);
                const material = new THREE.MeshBasicMaterial({
                    color: getPlanetColor(planet.type),
                    transparent: true,
                    opacity: 0.9
                });
                const sphere = new THREE.Mesh(geometry, material);

                // Position (scale to match stars)
                sphere.position.set(planet.x * 10, planet.y * 10, planet.z * 10);
                sphere.userData = planet; // Store planet data
                planetGroup.add(sphere);
                planetObjects.push(sphere);

                // Draw orbit path
                if (starMap[planet.star]) {
                    const starPos = starMap[planet.star];
                    const orbitRadius = planet.orbit_au * 4.84814e-6 * 10; // AU to parsecs, scaled

                    const orbitCurve = new THREE.EllipseCurve(
                        starPos.x, starPos.y,  // Center
                        orbitRadius, orbitRadius,  // X and Y radius
                        0, 2 * Math.PI,  // Start and end angle
                        false,
                        0
                    );

                    const points = orbitCurve.getPoints(64);
                    const orbitGeometry = new THREE.BufferGeometry();
                    const orbitPositions = [];

                    points.forEach(p => {
                        orbitPositions.push(p.x, starPos.z, p.y);
                    });

                    orbitGeometry.setAttribute('position', new THREE.Float32BufferAttribute(orbitPositions, 3));

                    const orbitMaterial = new THREE.LineBasicMaterial({
                        color: 0x444444,
                        transparent: true,
                        opacity: 0.3
                    });

                    const orbitLine = new THREE.Line(orbitGeometry, orbitMaterial);
                    orbitGroup.add(orbitLine);
                }
            });

            return planetGroup;
        }

        // Create labels for stars and planets
        function createLabels(stars, planets) {
            // Add labels for named stars
            stars.forEach(star => {
                if (!star.name || star.name.trim() === '') return;

                // Create canvas for text
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 256;
                canvas.height = 64;

                context.fillStyle = 'rgba(0, 0, 0, 0.7)';
                context.fillRect(0, 0, canvas.width, canvas.height);

                context.font = 'Bold 20px Arial';
                context.fillStyle = '#4da6ff';
                context.textAlign = 'center';
                context.fillText(star.name, 128, 35);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMaterial);

                sprite.position.set(star.x * 10, star.y * 10 + 5, star.z * 10);
                sprite.scale.set(20, 5, 1);
                labelGroup.add(sprite);
            });

            // Add labels for planets
            planets.forEach(planet => {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 256;
                canvas.height = 64;

                context.fillStyle = 'rgba(0, 0, 0, 0.7)';
                context.fillRect(0, 0, canvas.width, canvas.height);

                context.font = '16px Arial';
                context.fillStyle = '#ffaa44';
                context.textAlign = 'center';
                context.fillText(planet.name, 128, 35);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMaterial);

                sprite.position.set(planet.x * 10, planet.y * 10 + 3, planet.z * 10);
                sprite.scale.set(15, 4, 1);
                labelGroup.add(sprite);
            });

            labelGroup.visible = showLabels;
        }

        // Update info display
        function updateInfo() {
            const pos = camera.position;
            document.getElementById('cameraPos').textContent =
                `Position: (${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)})`;
        }

        // Animation loop
        let time = 0;
        let lastTime = Date.now();
        function animate() {
            requestAnimationFrame(animate);

            const currentTime = Date.now();
            const deltaTime = (currentTime - lastTime) / 1000;  // Convert to seconds
            lastTime = currentTime;

            time += 0.01;

            // Update skybox
            if (spaceBackground && spaceBackground.material.uniforms) {
                spaceBackground.material.uniforms.time.value = time;
            }

            // Update orbital positions
            updateOrbitalPositions(deltaTime);

            controls.update();
            updateInfo();
            composer.render();
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        async function init() {
            starsData = await loadStarData();

            if (starsData.length === 0) {
                document.getElementById('loading').textContent =
                    'Error: Could not load star data. Please ensure data/hygdata_v3.csv exists.';
                return;
            }

            planetsData = await loadPlanetData();

            // Count unique star systems with planets
            const systems = new Set(planetsData.map(p => p.star));

            document.getElementById('starCount').textContent = starsData.length.toLocaleString();
            document.getElementById('planetCount').textContent = planetsData.length.toLocaleString();
            document.getElementById('systemCount').textContent = systems.size.toLocaleString();
            document.getElementById('loading').style.display = 'none';

            createStarField(starsData);
            if (planetsData.length > 0) {
                createPlanets(planetsData, starsData);
            }
            createLabels(starsData, planetsData);
            constellationLines = createConstellations();

            animate();
        }

        init();
    </script>
</body>
</html>
