<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Forge - 3D Star Map</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        canvas {
            display: block;
        }

        /* Info Panel (Top Left) */
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #info strong {
            color: #4da6ff;
            font-size: 16px;
        }

        /* Loading Screen */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 40px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(77, 166, 255, 0.3);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        /* Detail Panel (Right Side) */
        .detail-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 350px;
            max-height: 80vh;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            overflow-y: auto;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .info-panel-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, rgba(77, 166, 255, 0.2), rgba(0, 0, 0, 0.3));
        }

        .info-panel-header h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #4da6ff;
        }

        .object-type {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(77, 166, 255, 0.3);
            border-radius: 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-panel-content {
            padding: 20px;
        }

        .info-row {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-value {
            color: #fff;
            font-size: 14px;
        }

        /* Keyboard Shortcuts Overlay */
        .shortcuts-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .shortcuts-panel {
            background: rgba(20, 20, 20, 0.95);
            border-radius: 12px;
            padding: 0;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.8);
        }

        .shortcuts-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(77, 166, 255, 0.2), rgba(0, 0, 0, 0.3));
        }

        .shortcuts-header h2 {
            margin: 0;
            color: #4da6ff;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .shortcuts-content {
            padding: 20px;
        }

        .shortcuts-table {
            width: 100%;
            border-collapse: collapse;
        }

        .shortcuts-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .shortcuts-table td {
            padding: 12px 10px;
        }

        .shortcut-key {
            color: #4da6ff;
            font-weight: bold;
            white-space: nowrap;
            width: 150px;
        }

        .shortcut-description {
            color: #ccc;
        }

        /* Help Button */
        .help-button {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: rgba(77, 166, 255, 0.8);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .help-button:hover {
            background: rgba(77, 166, 255, 1);
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        /* Scrollbar Styling */
        .detail-panel::-webkit-scrollbar,
        .shortcuts-panel::-webkit-scrollbar {
            width: 8px;
        }

        .detail-panel::-webkit-scrollbar-track,
        .shortcuts-panel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .detail-panel::-webkit-scrollbar-thumb,
        .shortcuts-panel::-webkit-scrollbar-thumb {
            background: rgba(77, 166, 255, 0.5);
            border-radius: 4px;
        }

        .detail-panel::-webkit-scrollbar-thumb:hover,
        .shortcuts-panel::-webkit-scrollbar-thumb:hover {
            background: rgba(77, 166, 255, 0.7);
        }
    </style>
</head>
<body>
    <div id="loading">Loading astronomical data...</div>
    <div id="info">
        <strong>Galaxy Forge - Real Star & Planet Map</strong><br>
        <span id="starCount">0</span> stars | <span id="planetCount">0</span> planets<br>
        <span id="systemCount">0</span> planetary systems<br><br>
        <strong>Controls:</strong><br>
        • Drag to rotate<br>
        • Scroll to zoom<br>
        • Right-drag to pan<br><br>
        <span id="cameraPos"></span>
    </div>

    <button class="help-button" onclick="document.dispatchEvent(new KeyboardEvent('keydown', {key: '?'}))">?</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
