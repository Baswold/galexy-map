<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Forge - 3D Star Map</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            max-width: 300px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading star data...</div>
    <div id="info">
        <strong>Galaxy Forge - Real Star Map</strong><br>
        <span id="starCount">0</span> stars loaded<br><br>
        <strong>Controls:</strong><br>
        • Drag to rotate<br>
        • Scroll to zoom<br>
        • Right-drag to pan<br><br>
        <span id="cameraPos"></span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Camera controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 50000;
        controls.minDistance = 1;

        // Set initial camera position
        camera.position.set(0, 100, 200);
        controls.update();

        // Add ambient light for better visibility
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        // Function to convert spectral class to color
        function getStarColor(spectralClass) {
            if (!spectralClass) return 0xffffff;
            const type = spectralClass.charAt(0).toUpperCase();

            // Based on actual stellar spectral classifications
            const colorMap = {
                'O': 0x9bb0ff, // Blue
                'B': 0xaabfff, // Blue-white
                'A': 0xcad7ff, // White
                'F': 0xf8f7ff, // Yellow-white
                'G': 0xfff4ea, // Yellow (like our Sun)
                'K': 0xffd2a1, // Orange
                'M': 0xffcc6f, // Red-orange
            };

            return colorMap[type] || 0xffffff;
        }

        // Load star data
        async function loadStarData() {
            try {
                const response = await fetch('data/hygdata_v3.csv');
                const csvText = await response.text();

                const lines = csvText.split('\n');
                const headers = lines[0].split(',');

                // Find column indices
                const xIndex = headers.indexOf('x');
                const yIndex = headers.indexOf('y');
                const zIndex = headers.indexOf('z');
                const magIndex = headers.indexOf('mag');
                const specIndex = headers.indexOf('spect');
                const properNameIndex = headers.indexOf('proper');

                const stars = [];

                // Parse CSV (skip header)
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;

                    const cols = lines[i].split(',');

                    const x = parseFloat(cols[xIndex]);
                    const y = parseFloat(cols[yIndex]);
                    const z = parseFloat(cols[zIndex]);
                    const mag = parseFloat(cols[magIndex]);
                    const spect = cols[specIndex];
                    const name = cols[properNameIndex];

                    if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
                        stars.push({ x, y, z, mag, spect, name });
                    }
                }

                return stars;
            } catch (error) {
                console.error('Error loading star data:', error);
                return [];
            }
        }

        // Create star visualization
        function createStarField(stars) {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const sizes = [];

            stars.forEach(star => {
                // Position (scale coordinates for better visibility)
                positions.push(star.x * 10, star.y * 10, star.z * 10);

                // Color based on spectral class
                const color = new THREE.Color(getStarColor(star.spect));
                colors.push(color.r, color.g, color.b);

                // Size based on apparent magnitude (brighter = bigger)
                // Magnitude scale is inverted (lower = brighter)
                const brightness = Math.max(0.5, 8 - star.mag);
                sizes.push(brightness);
            });

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Custom shader material for better star rendering
            const material = new THREE.PointsMaterial({
                size: 2,
                vertexColors: true,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            return points;
        }

        // Update info display
        function updateInfo() {
            const pos = camera.position;
            document.getElementById('cameraPos').textContent =
                `Position: (${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)})`;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateInfo();
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        async function init() {
            const stars = await loadStarData();

            if (stars.length === 0) {
                document.getElementById('loading').textContent =
                    'Error: Could not load star data. Please ensure data/hygdata_v3.csv exists.';
                return;
            }

            document.getElementById('starCount').textContent = stars.length.toLocaleString();
            document.getElementById('loading').style.display = 'none';

            createStarField(stars);
            animate();
        }

        init();
    </script>
</body>
</html>
